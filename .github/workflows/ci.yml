name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Detect and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          echo "has_node=false" >> "$GITHUB_OUTPUT"
          echo "has_python=false" >> "$GITHUB_OUTPUT"
          echo "has_go=false" >> "$GITHUB_OUTPUT"

          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f go.mod ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies and run Node tests
        if: steps.detect.outputs.has_node == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if npm run | grep -q " test"; then
            npm test
          else
            echo "No npm test script defined"
          fi

          if npm run | grep -q " lint"; then
            npm run lint || true
          else
            echo "No npm lint script defined"
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies and run Python tests
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            pip install .
          fi

          if command -v pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "pytest not found - skipping tests"
          fi

          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          else
            echo "flake8 not found - skipping linter"
          fi

      - name: Set up Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Run Go tests
        if: steps.detect.outputs.has_go == 'true'
        shell: bash
        run: |
          go test ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results || true
            junit*.xml || true

      - name: Summary
        shell: bash
        run: |
          echo "Detection results: node=${{ steps.detect.outputs.has_node }}, python=${{ steps.detect.outputs.has_python }}, go=${{ steps.detect.outputs.has_go }}"
